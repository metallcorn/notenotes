---
# Отключение root-логина и парольной аутентификации.
#
# Черновой initial_hardening.yml держал этот блок закомментированным, потому
# что залочиться здесь легко. Вместо комментария — предохранители:
#   1. preflight: убеждаемся, что уже сидим под нужным юзером по ключу с sudo;
#   2. validate: sshd -t проверяет конфиг ДО его установки;
#   3. reload вместо restart — текущие сессии не рвутся;
#   4. sshd -T подтверждает ЭФФЕКТИВНЫЙ конфиг (а не только содержимое файла);
#   5. отдельным свежим подключением проверяем, что вход ещё работает.

- name: Preflight — assert we are not connected as root
  ansible.builtin.assert:
    that:
      - notenotes_admin_user in (ansible_env.SUDO_USER | default(ansible_user_id))
    fail_msg: >-
      Хардненинг SSH запущен не под {{ notenotes_admin_user }}. Отключение
      root-логина из root-сессии рискует оставить тебя без доступа.
      Сначала выполни make bootstrap, затем make harden.

- name: Preflight — confirm current session authenticated by public key
  ansible.builtin.command:
    cmd: "journalctl -u ssh --since '-10min' --no-pager -o cat"
  register: ssh_auth_log
  changed_when: false
  failed_when: false

- name: Preflight — warn if no recent publickey acceptance was logged
  ansible.builtin.debug:
    msg: >-
      В журнале за последние 10 минут не найдено 'Accepted publickey'.
      Это не обязательно ошибка (журнал мог быть усечён), но убедись, что
      вход по ключу действительно работает, прежде чем продолжать.
  when: "'Accepted publickey' not in (ssh_auth_log.stdout | default(''))"

- name: Detect whether sshd is socket-activated
  # Ubuntu 24.04 по умолчанию использует ssh.socket, а не ssh.service.
  # В этом режиме каждое подключение поднимает свой sshd и читает конфиг
  # заново, поэтому reload не нужен — а попытка сделать reload ssh.service
  # завершилась бы ошибкой "Unit is not active".
  # noqa command-instead-of-module — модуль systemd умеет менять состояние
  # юнита, но не умеет сообщить, активирован ли сокет; здесь нужен именно
  # read-only опрос.
  ansible.builtin.command:
    cmd: systemctl is-active ssh.socket
  register: ssh_socket_state
  changed_when: false
  failed_when: false

- name: Record socket activation as a fact
  ansible.builtin.set_fact:
    ssh_socket_activated: "{{ (ssh_socket_state.stdout | trim) == 'active' }}"

- name: Install hardening drop-in
  ansible.builtin.template:
    src: 01-notenotes-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/01-notenotes-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Reload sshd

- name: Stop cloud-init from re-enabling password authentication on reboot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-notenotes-ssh.cfg
    content: |
      # Управляется Ansible (roles/ssh_hardening).
      # Без этого cloud-init может вернуть PasswordAuthentication yes
      # в 50-cloud-init.conf при следующей загрузке.
      ssh_pwauth: false
    owner: root
    group: root
    mode: "0644"

- name: Apply pending sshd changes now
  ansible.builtin.meta: flush_handlers

- name: Read effective sshd configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  register: sshd_effective
  changed_when: false

- name: Assert hardening actually took effect
  # Проверяем эффективный конфиг, а не файл: именно так отловится ситуация,
  # когда drop-in проигрывает по порядку какому-то другому файлу.
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in sshd_effective.stdout | lower"
      - "'passwordauthentication no' in sshd_effective.stdout | lower"
      - "'kbdinteractiveauthentication no' in sshd_effective.stdout | lower"
    fail_msg: >-
      Эффективный конфиг sshd не соответствует ожиданиям — вероятно, другой
      файл в /etc/ssh/sshd_config.d/ читается раньше нашего. Проверь
      `sudo sshd -T | grep -E 'permitroot|passwordauth'` и порядок файлов.
    success_msg: "Root-логин и парольная аутентификация отключены."

- name: Verify key-based login still works from a fresh connection
  # Ключ указывается явно. Без -i ssh берёт дефолтные имена (~/.ssh/id_ed25519
  # и т.п.), которых на сервере нет, и проверка падала бы, хотя доступ есть.
  # ControlPath=none — чтобы не попасть в уже открытое мультиплексированное
  # соединение и проверить именно новое подключение.
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - ControlPath=none
      - -o
      - ConnectTimeout=10
      - -i
      - "{{ notenotes_ssh_public_key_file | expanduser | regex_replace('\\.pub$', '') }}"
      - "{{ notenotes_admin_user }}@{{ inventory_hostname }}"
      - "echo SSH_STILL_OK"
  delegate_to: localhost
  become: false
  register: ssh_post_check
  changed_when: false
  failed_when: "'SSH_STILL_OK' not in ssh_post_check.stdout"

- name: Verify password authentication is refused
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - ControlPath=none
      - -o
      - PreferredAuthentications=password
      - -o
      - PubkeyAuthentication=no
      - -o
      - ConnectTimeout=10
      - "root@{{ inventory_hostname }}"
      - "true"
  delegate_to: localhost
  become: false
  register: ssh_password_check
  changed_when: false
  failed_when: ssh_password_check.rc == 0
