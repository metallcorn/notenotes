---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload edge proxy
  # reload, а не restart: Caddy подхватывает конфиг без разрыва соединений
  # и без потери уже полученных сертификатов.
  ansible.builtin.systemd_service:
    name: edge.service
    state: reloaded
  failed_when: false

- name: Restart edge proxy
  ansible.builtin.systemd_service:
    name: edge.service
    state: restarted
    daemon_reload: true
