---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart notenotes stack
  ansible.builtin.systemd_service:
    name: notenotes.service
    state: restarted
    daemon_reload: true

- name: Reload edge proxy
  # Приложение меняет только свой фрагмент конфига, поэтому прокси
  # перечитывает конфигурацию, а не перезапускается: соединения других
  # приложений не рвутся, полученные сертификаты не теряются.
  ansible.builtin.systemd_service:
    name: edge.service
    state: reloaded
