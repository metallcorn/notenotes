---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Apply safe upgrades
  # safe, а не dist: dist может подтянуть новое ядро и потребовать ребут,
  # а ребут при включённом LUKS роняет приложение до ручной разблокировки.
  # Ядро обновляем осознанно, вручную.
  ansible.builtin.apt:
    upgrade: safe

- name: Install base packages
  ansible.builtin.apt:
    name:
      - acl
      - ca-certificates
      - cryptsetup
      - curl
      - fail2ban
      - git
      - gnupg
      - htop
      - jq
      - ncdu
      - rsync
      - ufw
      - unattended-upgrades
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ notenotes_timezone }}"

# --- Автоматические обновления безопасности ---------------------------------

- name: Enable unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended upgrades for security only, without auto-reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52notenotes-unattended-upgrades
    content: |
      // Управляется Ansible (roles/baseline).
      //
      // Allowed-Origins в APT — список, и обычное присваивание к нему
      // ДОПОЛНЯЕТ значения из 50unattended-upgrades. Поэтому сначала #clear,
      // иначе сюда протекли бы -updates, которые мы намеренно не берём.
      #clear Unattended-Upgrade::Allowed-Origins;
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };

      // Авто-ребут выключен сознательно: при включённом LUKS сервер поднялся бы
      // без смонтированного тома, и приложение лежало бы до ручного unlock.
      Unattended-Upgrade::Automatic-Reboot "false";

      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
    owner: root
    group: root
    mode: "0644"

# --- Своп ------------------------------------------------------------------
#
# zram ПЕРВЫМ, swapfile в LUKS — последним рубежом. Сначала было наоборот:
# zram выкинули (модуля нет в ядре, тянуть linux-modules-extra на 113 МБ за
# каждым обновлением не хотелось), а своп оставили только дисковый, внутри
# шифрованного тома.
#
# Это стоило двух зависаний по шесть часов (19.08 и 11.09.2026). Механизм
# с консоли хостера: шифрованный том — это ФАЙЛ на корневом диске через
# loop0, а своп лежит внутри него. Под сборкой образа диск занят, память
# под давлением, kswapd выгружает страницы -> своп идёт через dm-crypt и
# loop -> loop сам требует page cache, то есть ту память, которую kswapd
# освобождает -> jbd2 ждёт диск, dmcrypt ждёт jbd2, kswapd ждёт dmcrypt.
# OOM-killer молчит: памяти хватает, все ждут I/O, которого не будет.
#
# zram в эту цепочку не входит вовсе — сжатый своп в памяти, диск не
# участвует. С приоритетом 100 он забирает давление первым; swapfile в
# LUKS (приоритет 10, роль luks_data) остаётся как страховка от OOM,
# когда и zram полон. Расшифрованные страницы на открытый диск по-прежнему
# не попадают: zram живёт в RAM, дисковый своп — внутри тома.
#
# 113 МБ модулей за обновление ядра — принимаем: Remove-Unused-Kernel-Packages
# выше подчищает старые версии.
#
# ВАЖНО, И ЭТО СТОИЛО ПРОБЕЛА В ЗАЩИТЕ 17.10.2026. Первая версия ставила
# linux-modules-extra-{{ ansible_kernel }} — пакет ПО НОМЕРУ ядра, которое
# работало в момент развёртывания. Комментарий выше считал, что модули
# поедут «за каждым обновлением» — но пакет с конкретной версией ничто не
# тянет: мета-пакет linux-virtual зависит только от linux-image-<ver>, без
# extra. После ребута на 6.8.0-147 модуля не оказалось вовсе:
#
#   zramswap: modprobe: FATAL: Module zram not found in directory
#             /lib/modules/6.8.0-147-generic
#
# и сервер остался ровно с тем своп-путём (только файл внутри LUKS), из-за
# которого и вис 19.08 и 11.09. Заметили только потому, что после ребута
# проверили swapon --show.
#
# Следует за ядром мета-пакет linux-image-extra-virtual. Он тянет
# linux-image-generic — но на Ubuntu 24.04 «virtual» и «generic» это ОДИН
# И ТОТ ЖЕ бинарь ядра (6.8.0-NNN-generic), разница только в том, что
# generic подтягивает extra-модули за каждым обновлением. Цена — разовые
# ~660 МБ прошивок (GPU, Wi-Fi), бесполезных на виртуалке; они обновляются
# на месте и не копятся. Принимаем: штатный механизм надёжнее самодельного
# хука, а самодельный сломался бы так же тихо, как этот.

- name: Remove zram configuration from the old generator, if any
  ansible.builtin.file:
    path: /etc/systemd/zram-generator.conf
    state: absent
  notify: Reload systemd

- name: Remove the old zram generator package
  # Заменён на zram-tools: у того проще конфиг и он не конфликтует с
  # swapfile, который подключает encrypted-unlock.
  ansible.builtin.apt:
    name: systemd-zram-generator
    state: absent
    purge: true

- name: Install kernel extra modules (zram lives there) and zram-tools
  ansible.builtin.apt:
    name:
      # Мета-пакет — чтобы extra-модули ехали за КАЖДЫМ новым ядром. Без
      # него zram пропадает после первого же обновления ядра (см. выше).
      - linux-image-extra-virtual
      # И для ядра, работающего прямо сейчас: мета-пакет может указывать
      # на более новое, ещё не загруженное ядро.
      - "linux-modules-extra-{{ ansible_kernel }}"
      - zram-tools
    state: present
    update_cache: true

- name: Configure zram swap
  ansible.builtin.copy:
    dest: /etc/default/zramswap
    content: |
      # Управляется Ansible (роль baseline). Причина и приоритеты — в
      # комментарии к блоку «Своп» в roles/baseline/tasks/main.yml.
      ALGO=zstd
      # Половина RAM как НЕСЖАТАЯ ёмкость устройства. Реально занято в
      # памяти — сжатое: zstd на страницах Postgres/Python даёт ~3:1,
      # то есть до ~700 МБ при полном заполнении.
      PERCENT=50
      # Выше, чем у swapfile в LUKS (10): zram забирает давление первым.
      PRIORITY=100
    owner: root
    group: root
    mode: "0644"
  notify: Restart zramswap

- name: Enable zram swap
  ansible.builtin.systemd:
    name: zramswap
    enabled: true
    state: started

- name: Tune kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-notenotes.conf
    state: present
    reload: true
  loop:
    # 10, а не дефолтные 60: для машины с Postgres выгоднее держать страницы
    # в памяти. Своп теперь zram + дисковый в LUKS (см. блок «Своп»), но
    # низкий swappiness всё равно верен — zram страховка, не штатный путь.
    - {name: vm.swappiness, value: "10"}
    # Зависшая задача ядра -> panic -> ребут через 10 с. Без этого сервер
    # висел по шесть часов (инциденты 19.08 и 11.09.2026): kswapd, jbd2 и
    # dmcrypt ждали друг друга, а журнал даже не писался. Ребут не поднимет
    # приложение сам (том закрыт до unlock), но SSH будет жив и о проблеме
    # станет известно через две минуты, а не через шесть часов.
    - {name: kernel.hung_task_panic, value: "1"}
    - {name: kernel.hung_task_timeout_secs, value: "120"}
    - {name: kernel.panic, value: "10"}
    - {name: vm.vfs_cache_pressure, value: "50"}
    - {name: fs.inotify.max_user_watches, value: "262144"}
    # Сетевая гигиена. net.ipv4.ip_forward НЕ трогаем — он нужен Docker.
    - {name: net.ipv4.tcp_syncookies, value: "1"}
    - {name: net.ipv4.conf.all.accept_redirects, value: "0"}
    - {name: net.ipv4.conf.all.send_redirects, value: "0"}
    - {name: net.ipv4.conf.all.accept_source_route, value: "0"}
    # net.ipv4.conf.all.log_martians намеренно НЕ выставляется. Docker
    # сбрасывает его в 0 при создании veth-интерфейсов, значение не держится,
    # и задача рапортовала бы об изменении на каждом прогоне, маскируя
    # настоящие расхождения. Это опция логирования, а не защита.

# --- Журналы ---------------------------------------------------------------

- name: Drop the log_martians setting left by earlier versions
  # Иначе в /etc/sysctl.d осталась бы строка, которой код больше не управляет:
  # состояние сервера расходилось бы с репозиторием.
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.log_martians
    sysctl_file: /etc/sysctl.d/99-notenotes.conf
    state: absent
    reload: true

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit journald size and retention
  # Короткая ретенция — часть решения по шифрованию: логи лежат на
  # НЕзашифрованном root и неизбежно копят метаданные (имена файлов, IP,
  # адреса), поэтому не храним их дольше, чем нужно для отладки.
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-notenotes.conf
    content: |
      # Управляется Ansible (roles/baseline).
      [Journal]
      Storage=persistent
      SystemMaxUse=200M
      MaxRetentionSec=14day
      Compress=yes
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Check whether a reboot is pending
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Report pending reboot
  ansible.builtin.debug:
    msg: >-
      Серверу нужен ребут (обновилось ядро или libc). Ребут НЕ выполняется
      автоматически: после него потребуется `make unlock`, иначе стек
      не поднимется. Планируй перезагрузку сам.
  when: reboot_required.stat.exists
