---
# Порты КОНТЕЙНЕРОВ, доступные из интернета через Docker.
# Всё остальное публикуется только на 127.0.0.1 (см. роль stack).
#
# Внимание: фильтрация в DOCKER-USER идёт по порту контейнера, а не хоста —
# DNAT происходит в nat/PREROUTING, то есть до FORWARD.
docker_ingress_allowed_ports:
  - 80
  - 443
