---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

- name: Restart docker-user-firewall
  ansible.builtin.systemd_service:
    name: docker-user-firewall
    state: restarted
    daemon_reload: true
