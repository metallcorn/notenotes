---
# Шаблон секретов. НЕ используется Ansible напрямую — скопируй значения в
# зашифрованный vault.yml:
#
#   ansible-vault create inventory/group_vars/all/vault.yml
#
# Сгенерировать стойкие значения:
#   openssl rand -base64 32
#
# Парольную фразу LUKS сохрани ОТДЕЛЬНО в менеджере паролей: без неё
# каталог данных не открыть, и восстановить его будет нечем.
# То же для vault_restic_password — без него бэкапы не расшифровать.

vault_postgres_password: "ЗАМЕНИ"
vault_redis_password: "ЗАМЕНИ"
vault_luks_passphrase: "ЗАМЕНИ"
vault_restic_password: "ЗАМЕНИ"
# Подписывает сессионные JWT backend'а. Смена значения разлогинит всех
# пользователей (все выданные cookie перестанут проходить проверку подписи).
vault_app_secret_key: "ЗАМЕНИ"

# Access key из панели MEGA S4. Нужны только при restic_backend: s4.
vault_restic_s4_access_key: "ЗАМЕНИ"
vault_restic_s4_secret_key: "ЗАМЕНИ"

# Фаза 2: AI-ассистент. Необязательны — main.yml подставляет '' по умолчанию,
# без ключей ассистент просто не сможет вызвать LLM/веб-поиск.
vault_llm_api_key: "ЗАМЕНИ"     # ключ Mistral (console.mistral.ai)
vault_tavily_api_key: "ЗАМЕНИ"  # ключ Tavily (tavily.com)

# Голосовой ассистент (ТЗ §10a, §14). ASR_PROVIDER в app.env.j2 по умолчанию
# deepgram — чтобы включить whisper вместо него, поменяй ASR_PROVIDER там же.
# Без PALABRA_API_KEY не работает озвучивание ответов.
vault_deepgram_api_key: "ЗАМЕНИ"  # console.deepgram.com
vault_whisper_api_key: "ЗАМЕНИ"   # платформенный ключ OpenAI (Whisper API)
vault_palabra_api_key: "ЗАМЕНИ"   # platform.palabra.ai

# Telegram-бот как канал захвата заметок (обычный Bot API, не MTProto).
# Токен и username — от @BotFather в Telegram. webhook_secret — случайная
# строка (та же openssl rand -base64 32), Telegram присылает её обратно в
# заголовке каждого запроса на вебхук, ей мы отличаем настоящие запросы от
# кого угодно, кто узнает URL вебхука.
vault_telegram_bot_token: "ЗАМЕНИ"     # токен от @BotFather
vault_telegram_bot_username: "ЗАМЕНИ"  # username бота без @, например notenotes_bot
vault_telegram_webhook_secret: "ЗАМЕНИ"

# Web Push (уведомления вне открытой вкладки/закрытого приложения) —
# self-hosted VAPID-пара, не платформенный ключ вендора. Сгенерировать:
#   python3 -c "
#   from cryptography.hazmat.primitives.asymmetric import ec
#   from cryptography.hazmat.primitives import serialization
#   import base64
#   k = ec.generate_private_key(ec.SECP256R1())
#   b64 = lambda d: base64.urlsafe_b64encode(d).rstrip(b'=').decode()
#   print('private:', b64(k.private_numbers().private_value.to_bytes(32, 'big')))
#   print('public:', b64(k.public_key().public_bytes(serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)))
#   "
# Смена ключей — все существующие подписки браузеров умирают, пользователям
# нужно будет заново включить тумблер в настройках.
vault_vapid_private_key: "ЗАМЕНИ"
vault_vapid_public_key: "ЗАМЕНИ"
vault_vapid_subject: "mailto:ЗАМЕНИ@example.com"

# Инвайт-код для регистрации (внешний пентест 2026-08-14: /auth/register
# был открыт всему интернету). Не задан/пусто — регистрация закрыта
# полностью. Сообщается лично тому, кого добавляешь — не публикуется.
vault_registration_invite_code: "ЗАМЕНИ"
