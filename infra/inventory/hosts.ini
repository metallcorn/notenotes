[vps:vars]
ansible_user=metallcorn
# connection=local: Ansible выполняется прямо на этом хосте, а не ходит по
# SSH на собственный публичный IP (это та же машина). Если когда-нибудь
# понадобится гонять плейбуки с другого компьютера (ноутбука) — вернуть
# ansible_connection=ssh и ansible_ssh_private_key_file=~/.ssh/notenotes_vps.
ansible_connection=local
ansible_python_interpreter=/usr/bin/python3
