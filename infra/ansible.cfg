[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
# Не stdout_callback = yaml: коллбэк community.general.yaml удалён в
# community.general 12.0.0. Тот же вывод даёт result_format у штатного default.
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
retry_files_enabled = False
display_skipped_hosts = False
forks = 10
# Явно не задаём vault_password_file: пароль хранилища вводится вручную
# (--ask-vault-pass), чтобы не плодить файл с паролем рядом с репозиторием.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
