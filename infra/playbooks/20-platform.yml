---
# Общая инфраструктура хоста, не привязанная к конкретному приложению:
# Docker, шифрованный том и edge-прокси.
#
#   make platform
#
# Роль luks_data при первом прогоне создаёт и открывает том. При последующих
# прогонах том должен быть уже открыт (make unlock).
#
# edge_proxy сознательно идёт последним и НЕ зависит от тома: прокси должен
# работать, даже когда все приложения лежат в ожидании разблокировки.

- name: Provision shared platform
  hosts: vps
  become: true
  gather_facts: true

  roles:
    - role: docker
    - role: luks_data
    - role: edge_proxy
